<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CJ Product Hunter — Side Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #ff7700;
      --bg: #f5f5f7;
      --white: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --danger: #dc2626;
      --success: #16a34a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Auth Overlay ── */
    .auth-overlay {
      position: absolute;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }
    .auth-overlay.hidden { display: none; }
    .auth-logo {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-msg {
      font-size: 12px;
      color: var(--danger);
      margin-bottom: 12px;
      min-height: 16px;
      text-align: center;
    }
    .auth-msg.ok { color: var(--success); }
    .auth-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }
    .auth-input:focus { border-color: var(--primary); }
    .auth-btn {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .auth-switch button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      padding: 0;
    }
    .auth-hint {
      margin-top: 14px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Main App ── */
    #app { display: none; flex-direction: column; height: 100%; }

    /* Header */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }
    .header-title-wrap { flex: 1; }
    .header-title {
      font-size: 15px;
      font-weight: 600;
    }
    .header-subtitle {
      font-size: 11px;
      color: var(--muted);
    }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: var(--bg);
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .hdr-btn:hover { background: var(--border); }

    /* Search Bar */
    .search-bar {
      background: var(--white);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input-wrap {
      position: relative;
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }
    .search-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .search-btn:hover { opacity: 0.9; }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .tab {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* Product Cards */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product-card {
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .product-card:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg);
    }
    .product-info { padding: 8px; }
    .product-name {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
      height: 29px;
    }
    .product-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }
    .product-meta {
      font-size: 9px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
    }
    .product-sold {
      background: #f0f0f0;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* Loading & Status */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 13px;
    }
    .status-bar {
      background: var(--white);
      padding: 7px 16px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34c759;
      margin-right: 5px;
    }
    .status-dot.offline { background: #ff3b30; }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Auth Overlay -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-logo">PH</div>
    <h2 class="auth-title">CJ Product Hunter</h2>
    <p class="auth-subtitle">Sign in to hunt winning products</p>
    <p class="auth-msg" id="authMsg"></p>

    <input type="email" id="authEmail" class="auth-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Password" autocomplete="current-password">

    <!-- Signup-only extra fields -->
    <div id="nameWrap" class="hidden" style="width:100%">
      <input type="text" id="authName" class="auth-input" placeholder="Full name (optional)" autocomplete="name" style="margin-bottom:6px">
    </div>

    <button id="authBtn" class="auth-btn" type="button">Sign In</button>

    <p class="auth-switch">
      <span id="switchLabel">Don't have an account?</span>
      <button id="toggleAuth" type="button">Sign Up</button>
    </p>

    <p class="auth-hint" id="authHint">Setup: go to <strong>My CJ → API</strong> in cjdropshipping.com and generate an API key.</p>
  </div>

  <!-- Main App -->
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">PH</div>
      <div class="header-title-wrap">
        <div class="header-title">CJ Product Hunter</div>
        <div class="header-subtitle" id="userEmail">—</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" id="themeBtn" title="Toggle dark/light">🌙</button>
        <button class="hdr-btn" id="closePanel" title="Close panel">×</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="query" class="search-input" placeholder="Search winning products…">
        <button id="searchBtn" class="search-btn">Hunt</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="products">📦 Products</div>
      <div class="tab" data-tab="trending">🔥 Trending</div>
      <div class="tab" data-tab="suppliers">🏭 Suppliers</div>
    </div>

    <!-- Content -->
    <div class="content" id="content">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>Enter a keyword to find winning products</p>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">Ready</span></span>
      <span id="resultCount">—</span>
    </div>
  </div>

<script>
/* ── Config ──────────────────────────────────────────────────── */
const API_BASE = "https://cj-winning-product-hunter-poc.vercel.app";
const TOKEN_KEY  = "cj_ph_token";          // sidepanel uses its own key
const THEME_KEY  = "cjphTheme";
let token     = localStorage.getItem(TOKEN_KEY) || "";
let authMode  = "signin";                   // "signin" | "signup"
let currentTab = "products";

/* ── DOM helpers ─────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const q   = (sel) => document.querySelector(sel);
const qs  = (sel) => document.querySelectorAll(sel);

/* ── Auth UI helpers ─────────────────────────────────────────── */
function getEl(id) { return $(id); }

function showAuthMsg(msg, ok) {
  const el = $("authMsg");
  el.textContent = msg || "";
  el.className = "auth-msg" + (ok ? " ok" : "");
}

function updateSwitchLabel() {
  if (authMode === "signin") {
    $("switchLabel").textContent = "Don't have an account? ";
    $("authBtn").textContent   = "Sign In";
  } else {
    $("switchLabel").textContent = "Already have an account? ";
    $("authBtn").textContent   = "Create Account";
  }
}

function setAuthMode(mode) {
  authMode = mode;
  updateSwitchLabel();
  showAuthMsg("");
}

function showAppUI(user) {
  $("authOverlay").classList.add("hidden");
  const app = $("app");
  app.style.display = "flex";
  if (user && user.email) {
    $("userEmail").textContent = user.full_name || user.email;
  }
}

function showAuthUI() {
  $("authOverlay").classList.remove("hidden");
  $("app").style.display = "none";
  showAuthMsg("");
}

/* ── Token / session ─────────────────────────────────────────── */
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...opts.headers };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(API_BASE + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) {
    token = ""; localStorage.removeItem(TOKEN_KEY); showAuthUI(); throw new Error("Session expired — please sign in again.");
  }
  return res.json().catch(() => null);
}

/* ── Submit Auth (Sign In / Sign Up) ────────────────────────── */
async function submitAuth() {
  const email   = ($("authEmail").value || "").trim();
  const password = $("authPassword").value || "";
  showAuthMsg(authMode === "signup" ? "Creating your account…" : "Signing in…");
  $("authBtn").disabled = true;

  try {
    if (!email || !password) { showAuthMsg("Please enter your email and password."); $("authBtn").disabled = false; return; }
    if (authMode === "signup" && password.length < 8) { showAuthMsg("Password must be at least 8 characters.", false); $("authBtn").disabled = false; return; }

    const path  = authMode === "signup" ? "/api/auth/signup" : "/api/auth/login";
    const data  = await apiFetch(path, { method: "POST", body: { email, password } });

    console.log("[CJ-PH][side] auth response:", data);

    if (!data) { showAuthMsg("Network error — check your connection.", false); $("authBtn").disabled = false; return; }

    if (authMode === "signup") {
      if (data.token) {
        // Auto-login on signup
        token = data.token;
        localStorage.setItem(TOKEN_KEY, token);
        const me = await apiFetch("/api/auth/me");
        if (me && me.email) { showAppUI(me); }
        else { showAuthMsg("Account created but profile load failed.", false); $("authBtn").disabled = false; }
      } else {
        // Email confirmation required
        showAuthMsg("✅ Account created! Check your email and click the confirmation link, then sign in.", true);
        setAuthMode("signin");          // ← reset so Sign In button works
        $("authBtn").disabled = false;
      }
    } else {
      // Login
      if (!data.token) { showAuthMsg(data.error || "Invalid email or password.", false); $("authBtn").disabled = false; return; }
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      const me = await apiFetch("/api/auth/me");
      if (me && me.email) { showAppUI(me); }
      else { showAuthMsg("Signed in but profile could not be loaded.", false); $("authBtn").disabled = false; }
    }
  } catch (err) {
    console.error("[CJ-PH][side] auth error:", err);
    showAuthMsg(err.message || "Authentication failed.", false);
    $("authBtn").disabled = false;
  }
}

/* ── Document-level event delegation (survives DOM replacements) ─*/
document.addEventListener("click", (evt) => {
  const t = evt.target;

  /* Sign In / Create Account */
  if (t.id === "authBtn" || t.closest("#authBtn")) {
    evt.preventDefault(); evt.stopPropagation();
    submitAuth();
    return;
  }

  /* Toggle signin ↔ signup */
  if (t.id === "toggleAuth" || t.closest("#toggleAuth")) {
    evt.preventDefault(); evt.stopPropagation();
    setAuthMode(authMode === "signin" ? "signup" : "signin");
    return;
  }

  /* Close panel */
  if (t.id === "closePanel" || t.closest("#closePanel")) {
    window.close();
    return;
  }

  /* Theme toggle */
  if (t.id === "themeBtn" || t.closest("#themeBtn")) {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark";
    if (isDark) { root.removeAttribute("data-theme"); try { localStorage.setItem(THEME_KEY, "light"); } catch {} q("#themeBtn").textContent = "🌙"; }
    else         { root.setAttribute("data-theme", "dark"); try { localStorage.setItem(THEME_KEY, "dark"); } catch {} q("#themeBtn").textContent = "☀️"; }
    return;
  }

  /* Tab switches */
  if (t.classList.contains("tab")) {
    qs(".tab").forEach(tab => tab.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    if (currentTab === "products") loadProducts();
    else if (currentTab === "trending") loadTrending();
    else content.innerHTML = '<div class="empty-state"><div class="empty-icon">🏭</div><p>Suppliers coming soon</p></div>';
    return;
  }

  /* Product card click → open in main window */
  const card = t.closest(".product-card");
  if (card) {
    const pid = card.dataset.id;
    chrome.runtime.sendMessage({ action: "openProduct", productId: pid }).catch(() => {});
    return;
  }
});

/* Enter key in auth form submits */
document.addEventListener("keydown", (evt) => {
  if (evt.key === "Enter" && !$("authOverlay").classList.contains("hidden")) {
    submitAuth();
  }
});

/* ── Load Products ───────────────────────────────────────────── */
function renderCard(p) {
  return `<div class="product-card" data-id="${p.id}">
    <img class="product-img" src="${p.image || ''}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23aaa%22 font-size=%2210%22>No img</text></svg>'">
    <div class="product-info">
      <div class="product-name">${esc(p.name || "Untitled")}</div>
      <div class="product-price">$${Number(p.cjCost || 0).toFixed(2)}</div>
      <div class="product-meta"><span class="product-sold">${(p.totalSales||0).toLocaleString()} sold</span><span>⭐ ${p.score||0}/100</span></div>
    </div></div>`;
}
function esc(s) { return String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]); }

async function loadProducts(qry) {
  setContent('<div class="loading">Searching…</div>');
  try {
    const query = qry !== undefined ? qry : (q("#query")?.value || "").trim();
    const url = `/api/public/products?page=1&pageSize=10&q=${encodeURIComponent(query)}&sort=winning`;
    const data = await apiFetch(url);
    const list = data?.products || [];
    $("resultCount").textContent = `${list.length} results`;
    if (!list.length) { setContent(`<div class="empty-state"><div class="empty-icon">🔍</div><p>No products found for "${esc(query)}"</p></div>`); return; }
    setContent(`<div class="product-grid">${list.map(renderCard).join("")}</div>`);
  } catch (err) {
    setContent(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${esc(err.message)}</p></div>`);
  }
}

async function loadTrending(country) {
  setContent('<div class="loading">Loading trending…</div>');
  try {
    const url = `/api/public/products?trending=true&page=1&pageSize=10${country ? "&country="+encodeURIComponent(country) : ""}`;
    const data = await apiFetch(url);
    const list = data?.products || [];
    $("resultCount").textContent = `🔥 ${list.length} trending`;
    if (!list.length) { setContent(`<div class="empty-state"><div class="empty-icon">🔥</div><p>No trending products found</p></div>`); return; }
    setContent(`<div class="product-grid">${list.map(renderCard).join("")}</div>`);
  } catch (err) {
    setContent(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${esc(err.message)}</p></div>`);
  }
}

function setContent(html) { $("content").innerHTML = html; }

/* Search button & Enter key */
q("#searchBtn").addEventListener("click", () => loadProducts());
q("#query").addEventListener("keypress", (e) => { if (e.key==="Enter") loadProducts(); });

/* ── Init ────────────────────────────────────────────────────── */
(function init() {
  // Restore theme
  const storedTheme = localStorage.getItem(THEME_KEY);
  if (storedTheme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  q("#themeBtn").textContent = storedTheme === "dark" ? "☀️" : "🌙";

  if (!token) { showAuthUI(); return; }
  apiFetch("/api/auth/me").then((me) => {
    if (me && me.email) { showAppUI(me); }
    else { showAuthUI(); }
  }).catch(() => showAuthUI());
})();
</script>
</body>
</html>
