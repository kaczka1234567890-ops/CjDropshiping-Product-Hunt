<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CJ Product Hunter — Side Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #ff7700;
      --bg: #f5f5f7;
      --white: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --danger: #dc2626;
      --success: #16a34a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Auth Overlay ── */
    .auth-overlay {
      position: absolute;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }
    .auth-overlay.hidden { display: none; }
    .auth-logo {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-msg {
      font-size: 12px;
      color: var(--danger);
      margin-bottom: 10px;
      min-height: 16px;
      text-align: center;
    }
    .auth-msg.ok { color: var(--success); }
    .auth-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }
    .auth-input:focus { border-color: var(--primary); }
    .extra-fields {
      width: 100%;
      display: none;
      margin-bottom: 8px;
    }
    .extra-fields.show { display: block; }
    .auth-btn {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .auth-switch button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      padding: 0;
    }
    .auth-hint {
      margin-top: 14px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Main App ── */
    #app { display: none; flex-direction: column; height: 100%; }

    /* Header */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }
    .header-title-wrap { flex: 1; }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-subtitle { font-size: 11px; color: var(--muted); }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: var(--bg);
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .hdr-btn:hover { background: var(--border); }

    /* Search Bar */
    .search-bar {
      background: var(--white);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input-wrap {
      position: relative;
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }
    .search-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .tab {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 12px; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product-card {
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .product-card:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg); }
    .product-info { padding: 8px; }
    .product-name {
      font-size: 11px; font-weight: 500; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 5px; height: 29px;
    }
    .product-price { font-size: 13px; font-weight: 700; color: var(--primary); }
    .product-meta { font-size: 9px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
    .product-sold { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }

    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
    .status-bar {
      background: var(--white); padding: 7px 16px; font-size: 10px; color: var(--muted);
      border-top: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; flex-shrink: 0;
    }
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34c759; margin-right: 5px; }
    .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 12px; }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ═══════════ AUTH OVERLAY ═══════════ -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-logo">PH</div>
    <h2 class="auth-title">CJ Product Hunter</h2>
    <p class="auth-subtitle">Sign in to hunt winning products</p>
    <p class="auth-msg" id="authMsg"></p>

    <input type="email" id="authEmail" class="auth-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Password" autocomplete="current-password">

    <!-- Extra fields for SIGN UP only — hidden on Sign In -->
    <div class="extra-fields" id="extraFields">
      <input type="text" id="authName" class="auth-input" placeholder="Full name (optional)" autocomplete="name">
    </div>

    <button id="authBtn" class="auth-btn" type="button" onclick="CJPH.submitAuth()">Sign In</button>

    <!-- Toggle link — direct onclick, no innerHTML replacement bug -->
    <p class="auth-switch">
      <span id="switchLabel">Don't have an account? </span>
      <button id="toggleAuth" type="button" onclick="CJPH.toggleMode()">Sign Up</button>
    </p>

    <p class="auth-hint">Setup: go to <strong>My CJ → API</strong> in cjdropshipping.com and generate an API key.</p>
  </div>

  <!-- ═══════════ MAIN APP ═══════════ -->
  <div id="app">
    <div class="header">
      <div class="logo">PH</div>
      <div class="header-title-wrap">
        <div class="header-title">CJ Product Hunter</div>
        <div class="header-subtitle" id="userEmail">—</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" id="themeBtn" title="Toggle theme" onclick="CJPH.toggleTheme()">🌙</button>
        <button class="hdr-btn" id="closePanel" title="Close" onclick="window.close()">×</button>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="query" class="search-input" placeholder="Search winning products…">
        <button id="searchBtn" class="search-btn" onclick="CJPH.loadProducts()">Hunt</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="products" onclick="CJPH.switchTab('products')">📦 Products</div>
      <div class="tab" data-tab="trending" onclick="CJPH.switchTab('trending')">🔥 Trending</div>
      <div class="tab" data-tab="suppliers" onclick="CJPH.switchTab('suppliers')">🏭 Suppliers</div>
    </div>

    <div class="content" id="content">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>Enter a keyword to find winning products</p>
      </div>
    </div>

    <div class="status-bar">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">Ready</span></span>
      <span id="resultCount">—</span>
    </div>
  </div>

<script>
/* ── Config ─────────────────────────────────────────────────────── */
const API_BASE = "https://cj-winning-product-hunter-poc.vercel.app";
const TOKEN_KEY  = "cj_ph_token";
let token     = localStorage.getItem(TOKEN_KEY) || "";
let authMode  = "signin";   // "signin" | "signup"

/* ── DOM refs ───────────────────────────────────────────────────── */
const el = id => document.getElementById(id);

/* ── Auth helpers ───────────────────────────────────────────────── */
function showMsg(msg, ok) {
  const m = el("authMsg");
  if (!m) { console.log("[CJ-PH][side] authMsg element missing"); return; }
  m.textContent = msg || "";
  m.className = "auth-msg" + (ok ? " ok" : "");
  console.log("[CJ-PH][side] showMsg:", msg, ok ? "(ok)" : "(err)");
}

function applyMode(mode) {
  authMode = mode;
  if (mode === "signup") {
    el("authBtn").textContent  = "Create Account";
    el("toggleAuth").textContent = "Sign In";
    el("switchLabel").textContent = "Already have an account? ";
    el("extraFields").classList.add("show");
  } else {
    el("authBtn").textContent  = "Sign In";
    el("toggleAuth").textContent = "Sign Up";
    el("switchLabel").textContent = "Don't have an account? ";
    el("extraFields").classList.remove("show");
  }
  showMsg("");
}

function showAppUI(user) {
  el("authOverlay").classList.add("hidden");
  const app = el("app");
  app.style.display = "flex";
  if (user && user.email) el("userEmail").textContent = user.full_name || user.email;
  console.log("[CJ-PH][side] showAppUI:", user ? user.email : "none");
}

function showAuthUI() {
  el("authOverlay").classList.remove("hidden");
  el("app").style.display = "none";
  applyMode(authMode);
}

/* ── API ────────────────────────────────────────────────────────── */
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...opts.headers };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  console.log("[CJ-PH][side] apiFetch:", opts.method||"GET", path, token ? "tok=***" : "no tok");
  const res = await fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  console.log("[CJ-PH][side] status:", res.status);
  if (res.status === 401) {
    token = ""; localStorage.removeItem(TOKEN_KEY); showAuthUI();
    throw new Error("Session expired — please sign in.");
  }
  return res.json().catch(() => null);
}

/* ── Submit auth (sign-in / sign-up) ───────────────────────────── */
window.CJPH = {
  submitAuth: async function() {
    console.log("[CJ-PH][side] submitAuth called, mode=", authMode);
    const email    = (el("authEmail").value  || "").trim();
    const password =  el("authPassword").value || "";
    const fullname = (el("authName")?.value  || "").trim();

    if (!email || !password)  { showMsg("Please enter your email and password.", false); return; }
    if (authMode === "signup" && password.length < 8) { showMsg("Password must be at least 8 characters.", false); return; }

    el("authBtn").disabled = true;
    showMsg(authMode === "signup" ? "Creating your account…" : "Signing in…", false);

    try {
      const path  = authMode === "signup" ? "/api/auth/signup" : "/api/auth/login";
      const data  = await apiFetch(path, { method: "POST", body: { email, password, ...(authMode==="signup"&&fullname?{fullName:fullname}:{}) } });

      console.log("[CJ-PH][side] auth response:", data);

      if (!data)                                   { showMsg("Network error — check connection.", false); el("authBtn").disabled=false; return; }

      if (authMode === "signup") {
        if (data.token) {
          token     = data.token;
          localStorage.setItem(TOKEN_KEY, token);
          const me  = await apiFetch("/api/auth/me");
          if (me && me.email)  { showAppUI(me); }
          else                   { showMsg("Account created but profile load failed.", false); el("authBtn").disabled=false; }
        } else {
          showMsg("✅ Account created! Check your email, click the link, then sign in.", true);
          applyMode("signin");
          el("authBtn").disabled = false;
        }
      } else {
        if (!data.token)  { showMsg(data.error || "Invalid email or password.", false); el("authBtn").disabled=false; return; }
        token     = data.token;
        localStorage.setItem(TOKEN_KEY, token);
        const me  = await apiFetch("/api/auth/me");
        if (me && me.email) { showAppUI(me); }
        else                  { showMsg("Signed in but profile could not be loaded.", false); el("authBtn").disabled=false; }
      }
    } catch (err) {
      console.error("[CJ-PH][side] auth error:", err);
      showMsg(err.message || "Authentication failed.", false);
      el("authBtn").disabled = false;
    }
  },

  toggleMode: function() {
    console.log("[CJ-PH][side] toggleMode from", authMode, "to", authMode==="signin"?"signup":"signin");
    applyMode(authMode === "signin" ? "signup" : "signin");
  },

  toggleTheme: function() {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark";
    if (isDark) { root.removeAttribute("data-theme"); try{localStorage.setItem("cjphTheme","light");}catch{} el("themeBtn").textContent="🌙"; }
    else        { root.setAttribute("data-theme","dark");  try{localStorage.setItem("cjphTheme","dark");}catch{} el("themeBtn").textContent="☀️"; }
  },

  loadProducts: function() {
    el("content").innerHTML='<div class="loading">Searching…</div>';
    try {
      const q2 = (el("query")?.value||"").trim();
      CJPH._loadProducts(q2);
    } catch(e) { el("content").innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`; }
  },

  _loadProducts: async function(qry) {
    try {
      const data = await apiFetch(`/api/public/products?page=1&pageSize=10&q=${encodeURIComponent(qry)}&sort=winning`);
      const list = data?.products || [];
      el("resultCount").textContent=`${list.length} results`;
      if (!list.length) { el("content").innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><p>No products found</p></div>`; return; }
      el("content").innerHTML=`<div class="product-grid">${list.map(CJPH.renderCard).join("")}</div>`;
    } catch(e) { el("content").innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`; }
  },

  switchTab: function(tabName) {
    document.querySelectorAll(".tab").forEach(tb => tb.classList.remove("active"));
    const t = document.querySelector(`[data-tab="${tabName}"]`);
    if (t) t.classList.add("active");
    if (tabName==="products") CJPH.loadProducts();
    else if (tabName==="trending") CJPH._loadTrending();
    else el("content").innerHTML='<div class="empty-state"><div class="empty-icon">🏭</div><p>Suppliers coming soon</p></div>';
  },

  _loadTrending: async function() {
    try {
      const data = await apiFetch("/api/public/products?trending=true&page=1&pageSize=10");
      const list = data?.products || [];
      el("resultCount").textContent=`🔥 ${list.length} trending`;
      if (!list.length) { el("content").innerHTML=`<div class="empty-state"><div class="empty-icon">🔥</div><p>No trending products</p></div>`; return; }
      el("content").innerHTML=`<div class="product-grid">${list.map(CJPH.renderCard).join("")}</div>`;
    } catch(e) { el("content").innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`; }
  },

  renderCard: function(p) {
    const esc = s => String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
    return `<div class="product-card" data-id="${p.id}">
      <img class="product-img" src="${p.image||''}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23aaa%22 font-size=%2210%22>No img</text></svg>'">
      <div class="product-info">
        <div class="product-name">${esc(p.name||"Untitled")}</div>
        <div class="product-price">$${Number(p.cjCost||0).toFixed(2)}</div>
        <div class="product-meta"><span class="product-sold">${(p.totalSales||0).toLocaleString()} sold</span><span>⭐ ${p.score||0}/100</span></div>
      </div></div>`;
  },
};

/* ── Document-level delegation (backup safety net) ──────────────── */
document.addEventListener("click", (evt) => {
  console.log("[CJ-PH][side] delegation click:", evt.target.id || evt.target.className || evt.target.tagName);
  const t = evt.target;
  if (t.id === "authBtn" || t.closest("#authBtn")) { evt.preventDefault(); CJPH.submitAuth(); return; }
  if (t.id === "toggleAuth" || t.closest("#toggleAuth")) { evt.preventDefault(); CJPH.toggleMode(); return; }
  if (t.id === "closePanel" || t.closest("#closePanel")) { window.close(); return; }
  if (t.id === "themeBtn" || t.closest("#themeBtn")) { CJPH.toggleTheme(); return; }
});

document.addEventListener("keydown", (evt) => {
  if (evt.key==="Enter" && !el("authOverlay").classList.contains("hidden")) { CJPH.submitAuth(); }
  if (evt.key==="Enter" && el("query")) { CJPH.loadProducts(); }
});

/* ── Init ───────────────────────────────────────────────────────── */
(function init() {
  console.log("[CJ-PH][side] init — token:", token ? "***" : "none");
  const storedTheme = localStorage.getItem("cjphTheme");
  if (storedTheme==="dark") document.documentElement.setAttribute("data-theme","dark");
  el("themeBtn").textContent = storedTheme==="dark"?"☀️":"🌙";

  if (!token) { showAuthUI(); return; }
  apiFetch("/api/auth/me").then(me => {
    if (me && me.email) showAppUI(me);
    else                 showAuthUI();
  }).catch(() => showAuthUI());
})();
</script>
</body>
</html>
