<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CJ Product Hunter — Side Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #ff7700;
      --bg: #f5f5f7;
      --white: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --danger: #dc2626;
      --success: #16a34a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Auth Overlay ── */
    .auth-overlay {
      position: absolute;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }
    .auth-overlay.hidden { display: none; }
    .auth-logo {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 16px;
    }
    .auth-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-msg {
      font-size: 12px;
      color: var(--danger);
      margin-bottom: 10px;
      min-height: 16px;
      text-align: center;
    }
    .auth-msg.ok { color: var(--success); }
    .auth-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }
    .auth-input:focus { border-color: var(--primary); }
    .extra-fields {
      width: 100%;
      display: none;
      margin-bottom: 8px;
    }
    .extra-fields.show { display: block; }
    .auth-btn {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .auth-switch button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      padding: 0;
    }
    .auth-hint {
      margin-top: 14px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Main App ── */
    #app { display: none; flex-direction: column; height: 100%; }

    /* Header */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }
    .header-title-wrap { flex: 1; }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-subtitle { font-size: 11px; color: var(--muted); }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: var(--bg);
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .hdr-btn:hover { background: var(--border); }

    /* Search Bar */
    .search-bar {
      background: var(--white);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input-wrap {
      position: relative;
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }
    .search-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .tab {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 12px; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product-card {
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .product-card:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg); }
    .product-info { padding: 8px; }
    .product-name {
      font-size: 11px; font-weight: 500; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 5px; height: 29px;
    }
    .product-price { font-size: 13px; font-weight: 700; color: var(--primary); }
    .product-meta { font-size: 9px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
    .product-sold { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }

    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
    .status-bar {
      background: var(--white); padding: 7px 16px; font-size: 10px; color: var(--muted);
      border-top: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; flex-shrink: 0;
    }
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34c759; margin-right: 5px; }
    .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 12px; }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ═══════════ AUTH OVERLAY ═══════════ -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-logo">PH</div>
    <h2 class="auth-title">CJ Product Hunter</h2>
    <p class="auth-subtitle">Sign in to hunt winning products</p>
    <p class="auth-msg" id="authMsg"></p>

    <input type="email" id="authEmail" class="auth-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Password" autocomplete="current-password">

    <!-- Extra fields for SIGN UP only — hidden on Sign In -->
    <div class="extra-fields" id="extraFields">
      <input type="text" id="authName" class="auth-input" placeholder="Full name (optional)" autocomplete="name">
    </div>

    <button id="authBtn" class="auth-btn" type="button">Sign In</button>

    <!-- Toggle link — no inline onclick; handled via addEventListener -->
    <p class="auth-switch">
      <span id="switchLabel">Don't have an account? </span>
      <button id="toggleAuth" type="button">Sign Up</button>
    </p>

    <p class="auth-hint">Setup: go to <strong>My CJ → API</strong> in cjdropshipping.com and generate an API key.</p>
  </div>

  <!-- ═══════════ MAIN APP ═══════════ -->
  <div id="app">
    <div class="header">
      <div class="logo">PH</div>
      <div class="header-title-wrap">
        <div class="header-title">CJ Product Hunter</div>
        <div class="header-subtitle" id="userEmail">—</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" id="themeBtn" title="Toggle theme">🌙</button>
        <button class="hdr-btn" id="closePanel" title="Close">×</button>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="query" class="search-input" placeholder="Search winning products…">
        <button id="searchBtn" class="search-btn">Hunt</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="products">📦 Products</div>
      <div class="tab" data-tab="trending">🔥 Trending</div>
      <div class="tab" data-tab="suppliers">🏭 Suppliers</div>
    </div>

    <div class="content" id="content">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>Enter a keyword to find winning products</p>
      </div>
    </div>

    <div class="status-bar">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">Ready</span></span>
      <span id="resultCount">—</span>
    </div>
  </div>

<script src="sidepanel.js" defer></script>
</body>
</html>
